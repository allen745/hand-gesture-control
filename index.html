<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Particle Morph - Gen 2</title>
    <style>
        body { margin: 0; overflow: hidden; background: #050505; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        #ui {
            position: absolute; top: 30px; left: 30px; color: #00f2ff;
            background: rgba(0, 10, 20, 0.7); padding: 20px; border-radius: 15px;
            pointer-events: none; border: 1px solid #00f2ff; box-shadow: 0 0 20px rgba(0, 242, 255, 0.2);
        }
        #video-container {
            position: absolute; bottom: 20px; right: 20px;
            width: 180px; height: 135px; border: 2px solid #00f2ff; border-radius: 10px; overflow: hidden; opacity: 0.6;
        }
        video { width: 100%; height: 100%; transform: scaleX(-1); object-fit: cover; }
        .label { font-size: 12px; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 10px; opacity: 0.7; }
    </style>
</head>
<body>

<div id="ui">
    <div class="label">Neural Interface Active</div>
    <h2 style="margin:0 0 10px 0; font-weight: 300;">Cyber Morph OS</h2>
    <p><b>Pinch Index:</b> Next Geometry</p>
    <p><b>Point Finger:</b> Gravity Well</p>
    <p><b>Open Palm:</b> Expand / Increase Chaos</p>
    <div id="status">Syncing Camera...</div>
</div>

<div id="video-container">
    <video id="webcam" autoplay playsinline></video>
</div>

<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
        }
    }
</script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<script type="module">
    import * as THREE from 'three';

    // --- Config ---
    const PARTICLE_COUNT = 12000;
    const shapes = ['dna', 'torusKnot', 'cube', 'galaxy', 'pyramid'];
    let currentIdx = 0;

    // --- Scene Setup ---
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 6;

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    // --- Custom Shader ---
    const vertexShader = `
        uniform float uTime;
        uniform float uMorph;
        uniform float uChaos;
        attribute vec3 aTarget;
        varying vec3 vColor;
        
        void main() {
            vec3 pos = mix(position, aTarget, uMorph);
            
            // Add chaos jitter
            pos.x += sin(uTime * 10.0 + position.y) * uChaos * 0.2;
            pos.y += cos(uTime * 10.0 + position.z) * uChaos * 0.2;

            vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
            gl_PointSize = (8.0 / -mvPosition.z) * (1.0 + uChaos);
            gl_Position = projectionMatrix * mvPosition;
            
            // Color based on position and chaos
            vColor = mix(vec3(0.0, 0.8, 1.0), vec3(1.0, 0.0, 0.5), uChaos);
            vColor += abs(normalize(pos)) * 0.5;
        }
    `;

    const fragmentShader = `
        varying vec3 vColor;
        void main() {
            float d = distance(gl_PointCoord, vec2(0.5));
            if (d > 0.5) discard;
            float strength = pow(1.0 - d*2.0, 2.0);
            gl_FragColor = vec4(vColor, strength);
        }
    `;

    // --- Particles ---
    const geometry = new THREE.BufferGeometry();
    const posArray = new Float32Array(PARTICLE_COUNT * 3);
    const targetArray = new Float32Array(PARTICLE_COUNT * 3);

    for(let i=0; i<PARTICLE_COUNT*3; i++) posArray[i] = (Math.random()-0.5)*10;

    geometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
    geometry.setAttribute('aTarget', new THREE.BufferAttribute(targetArray, 3));

    const material = new THREE.ShaderMaterial({
        vertexShader, fragmentShader,
        uniforms: { 
            uTime: { value: 0 }, 
            uMorph: { value: 0 },
            uChaos: { value: 0 }
        },
        transparent: true, blending: THREE.AdditiveBlending, depthWrite: false
    });

    const points = new THREE.Points(geometry, material);
    scene.add(points);

    // --- Shape Generators ---
    function generateShape(type) {
        const arr = geometry.attributes.aTarget.array;
        for (let i = 0; i < PARTICLE_COUNT; i++) {
            let x, y, z;
            const p = i / PARTICLE_COUNT;

            if (type === 'dna') {
                const angle = p * Math.PI * 12;
                const side = i % 2 === 0 ? 1 : -1;
                x = Math.cos(angle) * side * 1.5;
                z = Math.sin(angle) * side * 1.5;
                y = (p - 0.5) * 8;
                // Add "steps" to the DNA
                if(Math.random() > 0.9) {
                    x = (Math.random()-0.5) * 2.0;
                    z = (Math.random()-0.5) * 2.0;
                }
            } 
            else if (type === 'torusKnot') {
                const t = p * Math.PI * 2 * 3;
                const r = 2 + Math.cos(3 * t);
                x = r * Math.cos(2 * t);
                y = r * Math.sin(2 * t);
                z = Math.sin(3 * t);
            } 
            else if (type === 'cube') {
                x = (Math.random() - 0.5) * 4;
                y = (Math.random() - 0.5) * 4;
                z = (Math.random() - 0.5) * 4;
                // Snap to grid edges for digital look
                if(Math.random() > 0.5) x = Math.round(x);
                if(Math.random() > 0.5) y = Math.round(y);
            } 
            else if (type === 'galaxy') {
                const angle = p * 40;
                const radius = p * 4;
                x = Math.cos(angle) * radius + (Math.random()-0.5);
                z = Math.sin(angle) * radius + (Math.random()-0.5);
                y = (Math.random() - 0.5) * 0.5;
            } 
            else { // Pyramid
                const py = Math.random();
                const px = (Math.random() - 0.5) * py;
                const pz = (Math.random() - 0.5) * py;
                x = px * 5;
                y = (py - 0.5) * 5;
                z = pz * 5;
            }

            arr[i * 3] = x;
            arr[i * 3 + 1] = y;
            arr[i * 3 + 2] = z;
        }
        geometry.attributes.aTarget.needsUpdate = true;
        material.uniforms.uMorph.value = 0;
    }

    generateShape(shapes[0]);

    // --- Hand Tracking ---
    const videoElement = document.getElementById('webcam');
    let cooldown = false;

    const hands = new Hands({ locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}` });
    hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.6 });

    hands.onResults((res) => {
        if (res.multiHandLandmarks && res.multiHandLandmarks.length > 0) {
            const marks = res.multiHandLandmarks[0];
            document.getElementById('status').innerText = "System Online";
            
            // Move whole system
            const wrist = marks[0];
            points.position.x += ((0.5 - wrist.x) * 12 - points.position.x) * 0.1;
            points.position.y += ((0.5 - wrist.y) * 8 - points.position.y) * 0.1;

            // Pinch Detection (Thumb & Index) -> Change Shape
            const distPinch = Math.hypot(marks[4].x - marks[8].x, marks[4].y - marks[8].y);
            if (distPinch < 0.04 && !cooldown) {
                currentIdx = (currentIdx + 1) % shapes.length;
                generateShape(shapes[currentIdx]);
                cooldown = true;
                setTimeout(() => cooldown = false, 1000);
            }

            // Palm Openness -> Chaos Level
            const distChaos = Math.hypot(marks[0].x - marks[12].x, marks[0].y - marks[12].y);
            material.uniforms.uChaos.value = THREE.MathUtils.lerp(material.uniforms.uChaos.value, distChaos > 0.3 ? 1.5 : 0.0, 0.1);

        } else {
            document.getElementById('status').innerText = "Scanning for hand...";
        }
    });

    const cameraCtrl = new Camera(videoElement, {
        onFrame: async () => { await hands.send({ image: videoElement }); },
        width: 640, height: 480
    });
    cameraCtrl.start();

    // --- Render Loop ---
    function animate() {
        requestAnimationFrame(animate);
        material.uniforms.uTime.value = performance.now() * 0.001;
        
        if (material.uniforms.uMorph.value < 1.0) {
            material.uniforms.uMorph.value += 0.015;
        }

        points.rotation.y += 0.005;
        renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
</script>
</body>
</html>
